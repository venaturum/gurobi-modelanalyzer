name: Release test

on:
  workflow_dispatch:

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
  test-wheels:
    # test-wheels triggers building of artifacts
    uses: ./.github/workflows/test-wheels.yml
    needs: [unit-tests]
  publish-pypi:
    uses: ./.github/workflows/publish-pypi.yml
    needs: [test-wheels]
    secrets: inherit
